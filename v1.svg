<svg viewBox="0 0 860 380" role="img" aria-label="Combined constructs flowchart">
              <defs>
                <marker id="arrow-combo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                  <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b6cb7"></path>
                </marker>
              </defs>

              <ellipse cx="70" cy="42" rx="44" ry="20" fill="#e9edff" stroke="#3346d3" stroke-width="2"></ellipse>
              <text x="70" y="47" text-anchor="middle" font-size="13">Start</text>

              <polygon points="130,20 252,20 234,64 112,64" fill="#eefbf8" stroke="#0f766e" stroke-width="2"></polygon>
              <text x="183" y="46" text-anchor="middle" font-size="12">INPUT totalBooks</text>

              <rect x="278" y="22" width="142" height="40" rx="8" fill="#f2f8ff" stroke="#3346d3" stroke-width="2"></rect>
              <text x="349" y="47" text-anchor="middle" font-size="12">book = 1</text>

              <polygon points="472,14 584,44 472,74 360,44" fill="#fff7e8" stroke="#c77700" stroke-width="2"></polygon>
              <text x="472" y="40" text-anchor="middle" font-size="12">book &lt;= totalBooks?</text>

              <polygon points="130,108 252,108 234,150 112,150" fill="#eefbf8" stroke="#0f766e" stroke-width="2"></polygon>
              <text x="183" y="133" text-anchor="middle" font-size="12">INPUT daysLate</text>

              <polygon points="352,102 460,132 352,162 244,132" fill="#fff7e8" stroke="#c77700" stroke-width="2"></polygon>
              <text x="352" y="128" text-anchor="middle" font-size="12">daysLate &gt; 0?</text>

              <rect x="494" y="112" width="188" height="40" rx="8" fill="#fff7e8" stroke="#c77700" stroke-width="2"></rect>
              <text x="588" y="137" text-anchor="middle" font-size="12">CALL CalculateFine(daysLate)</text>

              <polygon points="494,178 666,178 646,220 474,220" fill="#eefbf8" stroke="#0f766e" stroke-width="2"></polygon>
              <text x="570" y="203" text-anchor="middle" font-size="12">OUTPUT fine message</text>

              <rect x="240" y="246" width="142" height="40" rx="8" fill="#f2f8ff" stroke="#3346d3" stroke-width="2"></rect>
              <text x="311" y="271" text-anchor="middle" font-size="12">book = book + 1</text>

              <ellipse cx="770" cy="44" rx="44" ry="20" fill="#e9edff" stroke="#3346d3" stroke-width="2"></ellipse>
              <text x="770" y="49" text-anchor="middle" font-size="13">Stop</text>

              <rect x="702" y="128" width="132" height="100" rx="10" fill="#f8fbff" stroke="#b4bfeb" stroke-dasharray="5 4" stroke-width="2"></rect>
              <text x="768" y="148" text-anchor="middle" font-size="12" font-weight="700">Sub-routine</text>
              <text x="768" y="166" text-anchor="middle" font-size="11">CalculateFine</text>
              <text x="768" y="184" text-anchor="middle" font-size="11">fine = daysLate * rate</text>
              <text x="768" y="202" text-anchor="middle" font-size="11">RETURN fine</text>

              <line x1="114" y1="42" x2="130" y2="42" stroke="#4b6cb7" stroke-width="2.5" marker-end="url(#arrow-combo)"></line>
              <line x1="252" y1="42" x2="278" y2="42" stroke="#4b6cb7" stroke-width="2.5" marker-end="url(#arrow-combo)"></line>
              <line x1="420" y1="42" x2="360" y2="42" stroke="#4b6cb7" stroke-width="2.5" marker-end="url(#arrow-combo)"></line>
              <line x1="472" y1="74" x2="183" y2="108" stroke="#4b6cb7" stroke-width="2.5" marker-end="url(#arrow-combo)"></line>
              <line x1="252" y1="129" x2="244" y2="132" stroke="#4b6cb7" stroke-width="2.5" marker-end="url(#arrow-combo)"></line>
              <line x1="460" y1="132" x2="494" y2="132" stroke="#4b6cb7" stroke-width="2.5" marker-end="url(#arrow-combo)"></line>
              <line x1="588" y1="152" x2="588" y2="178" stroke="#4b6cb7" stroke-width="2.5" marker-end="url(#arrow-combo)"></line>
              <path d="M 474 199 L 311 199 L 311 246" fill="none" stroke="#4b6cb7" stroke-width="2.5" marker-end="url(#arrow-combo)"></path>
              <path d="M 311 286 L 311 318 L 472 318 L 472 74" fill="none" stroke="#4b6cb7" stroke-width="2.5" marker-end="url(#arrow-combo)"></path>
              <path d="M 584 44 L 726 44" fill="none" stroke="#4b6cb7" stroke-width="2.5" marker-end="url(#arrow-combo)"></path>
              <path d="M 702 132 L 682 132" fill="none" stroke="#4b6cb7" stroke-width="2.5" marker-end="url(#arrow-combo)"></path>
            </svg>